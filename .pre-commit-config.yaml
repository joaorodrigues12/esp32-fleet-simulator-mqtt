repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --no-sync ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --no-sync ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: Mypy strict
        entry: uv run --no-sync mypy src
        language: system
        pass_filenames: false
        types: [python]
      - id: conventional-commit
        name: Conventional Commit format
        entry: python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
