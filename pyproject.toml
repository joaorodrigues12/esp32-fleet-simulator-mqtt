[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "esp32-fleet-simulator-mqtt"
version = "0.0.0"
description = "Simulador independente de dispositivos ESP32 que publica sinais fisiologicos sinteticos via MQTT."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {file = "LICENSE"}
authors = [{name = "ESP32 Fleet Simulator contributors"}]
dependencies = [
  "aiomqtt>=2.4,<4",
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/esp32_fleet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/esp32_fleet"]

[tool.coverage.report]
fail_under = 80
