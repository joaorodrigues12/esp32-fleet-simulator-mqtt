# O Compose publica apenas a porta TLS no loopback do host.
listener 8883
certfile /mosquitto/data/server.pem
keyfile /mosquitto/data/server.key
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/data/passwords
acl_file /mosquitto/config/mosquitto.acl
persistence false
log_dest stdout
