name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Valida mudanças no CI antes da abertura do pull request.
      - "ci/**"

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            check_name: Qualidade e testes
          - os: windows-2025
            check_name: Qualidade e testes (Windows)
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Preparar o ambiente
        run: |
          uv python install
          uv sync --locked --group dev --extra gui

      - name: Verificar lint, formatação e tipos
        run: uv run --locked --extra gui pre-commit run --all-files

      - name: Instalar Mosquitto no Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mosquitto
          mosquitto_executable="$(command -v mosquitto)"
          test -x "$mosquitto_executable"
          printf 'MOSQUITTO_EXECUTABLE=%s\n' "$mosquitto_executable" >> "$GITHUB_ENV"

      - name: Preparar Mosquitto no Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = 'mosquitto-2.1.4-install-windows-x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP $package
          $destination = Join-Path $env:RUNNER_TEMP 'mosquitto'
          Invoke-WebRequest -Uri "https://mosquitto.org/files/binary/win64/$package" -OutFile $installer
          $expectedHash = '034017C8F8E3B5B86BDBD971F6C5184370311058E4DE7B96A0F10204BBB9E7C8'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'O SHA-256 do pacote do Mosquitto diverge do esperado.'
          }

          # Os testes iniciam o broker em loopback sem instalar um serviço do Windows.
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          & $sevenZip x -y "-o$destination" $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao extrair o Mosquitto (7-Zip: $LASTEXITCODE)."
          }
          $executable = Join-Path $destination 'mosquitto.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw 'O pacote extraído não contém mosquitto.exe.'
          }
          "MOSQUITTO_EXECUTABLE=$executable" >> $env:GITHUB_ENV

      - name: Executar os testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked --extra gui pytest -v -W error::pytest.PytestDeprecationWarning
