name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # Valida mudanças no CI antes da abertura do pull request.
      - "ci/**"

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade e testes
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Preparar o ambiente
        run: |
          uv python install
          uv sync --locked --group dev

      - name: Verificar lint, formatação e tipos
        run: uv run --locked pre-commit run --all-files

      - name: Executar os testes
        run: uv run --locked pytest -q -W error::pytest.PytestDeprecationWarning
